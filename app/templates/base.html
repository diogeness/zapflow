<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ZapFlow{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zap: { 50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d' },
                        dark: { 900:'#0f172a',800:'#1e293b',700:'#334155',600:'#475569',500:'#64748b',400:'#94a3b8',300:'#cbd5e1',200:'#e2e8f0',100:'#f1f5f9' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/htmx-ext-morphdom-swap@2.0.0/morphdom-swap.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .toast-enter { animation: slideIn 0.3s ease-out; }
        .toast-exit { animation: slideOut 0.3s ease-in forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }
        .chat-bubble-in { border-radius: 0 12px 12px 12px; }
        .chat-bubble-out { border-radius: 12px 0 12px 12px; }
        .sidebar-link.active { background-color: rgba(34,197,94,0.15); color: #22c55e; border-right: 3px solid #22c55e; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="h-full bg-dark-900 text-dark-100 dark">
    {% block body %}
    <div class="flex h-full" id="app-layout">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 w-64 bg-dark-800 border-r border-dark-700 transform transition-transform duration-200 lg:translate-x-0 lg:static -translate-x-full">
            <div class="flex items-center gap-3 px-6 py-5 border-b border-dark-700">
                <div class="w-9 h-9 bg-zap-500 rounded-lg flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <span class="text-xl font-bold text-dark-100">ZapFlow</span>
            </div>
            <nav class="mt-4 px-3 space-y-1">
                <a href="/" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-dark-300 hover:bg-dark-700 hover:text-dark-100 transition-colors {% if active_page == 'dashboard' %}active{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4"/></svg>
                    Dashboard
                </a>
                <a href="/instances" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-dark-300 hover:bg-dark-700 hover:text-dark-100 transition-colors {% if active_page == 'instances' %}active{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                    Instâncias
                </a>
                <a href="/campaigns" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-dark-300 hover:bg-dark-700 hover:text-dark-100 transition-colors {% if active_page == 'campaigns' %}active{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg>
                    Campanhas
                </a>
                <a href="/leads" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-dark-300 hover:bg-dark-700 hover:text-dark-100 transition-colors {% if active_page == 'leads' %}active{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Leads
                </a>
            </nav>
        </aside>

        <!-- Overlay for mobile sidebar -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 lg:hidden hidden" onclick="toggleSidebar()"></div>

        <!-- Main content -->
        <div class="flex-1 flex flex-col min-h-screen overflow-hidden">
            <!-- Topbar -->
            <header class="sticky top-0 z-10 bg-dark-800/80 backdrop-blur border-b border-dark-700">
                <div class="flex items-center justify-between px-4 py-3 lg:px-6">
                    <div class="flex items-center gap-3">
                        <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg hover:bg-dark-700">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                        </button>
                        <h1 class="text-lg font-semibold">{% block page_title %}Dashboard{% endblock %}</h1>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-sm text-dark-400">{{ username }}</span>
                        <button hx-post="/api/auth/logout" hx-swap="none" onclick="setTimeout(()=>window.location='/login',200)" class="text-sm text-dark-400 hover:text-red-400 transition-colors px-3 py-1.5 rounded-lg hover:bg-dark-700">
                            Sair
                        </button>
                    </div>
                </div>
            </header>

            <!-- Page content -->
            <main class="flex-1 overflow-y-auto p-4 lg:p-6">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const colors = {
                success: 'bg-zap-600 text-white',
                error: 'bg-red-600 text-white',
                warning: 'bg-amber-600 text-white',
                info: 'bg-blue-600 text-white'
            };
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-lg shadow-lg ${colors[type] || colors.info} toast-enter text-sm font-medium max-w-sm`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Listen for HTMX events to show toasts
        document.body.addEventListener('showToast', function(evt) {
            showToast(evt.detail.message, evt.detail.type);
        });

        // Handle HTMX errors
        document.body.addEventListener('htmx:responseError', function(evt) {
            showToast('Erro na requisição', 'error');
        });
    </script>
    {% block scripts %}{% endblock %}
    {% endblock %}
</body>
</html>
